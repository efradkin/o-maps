<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --navy: #036;  --dark: #024; --row-even: #fec; --border: #ddd; --f-size: 14px; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.03em; font-size: var(--f-size); margin: 0; display: flex; flex-direction: column; height: 100vh; color: var(--dark); overflow: hidden; background: #fff; }

    footer { background: #fff; padding: 10px; border-top: 1px solid var(--border); text-align: center; flex-shrink: 0; position: relative; }
    footer p { margin: 1px 0 0; color: #568; font-size: 12px; }
    header { background: #fff; padding: 5px; border-bottom: 1px solid var(--border); text-align: center; flex-shrink: 0; position: relative; }
    header h1 { margin: 6px; font-size: 14px; font-weight: normal; color: var(--navy); }
    header p { margin: 1px 0 0; color: #568; font-size: 12px; }
    .print-btn { position: absolute; right: 10px; top: 4px; padding: 6px 12px; cursor: pointer; background: var(--navy); color: #fff; border: none; border-radius: 3px; font-size: 14px; font-family: inherit; }

    main { display: flex; flex: 1; overflow: hidden; }
    nav { background: #fff; min-width: 120px; display: flex; flex-direction: column; padding: 6px; gap: 4px; overflow-y: auto; flex-shrink: 0; border-right: 1px solid var(--border); }
    button { padding: 6px 10px; border: 1px solid var(--navy); background: #eee; color: var(--navy); cursor: pointer; border-radius: 4px; text-align: left; white-space: nowrap; font-family: inherit; }
    button.active { background: var(--navy); color: #fff; }

   @media (max-width: 900px) {
      main { flex-direction: column; }
      nav { border-right: none; border-bottom: 2px solid var(--navy); flex-direction: row; overflow-x: auto; height: auto; padding: 10px 5px; }
      button { flex-shrink: 0; }
      header { display: none; }
       :root { --f-size: 12px; }  
}

    .view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #gt { background: #eee; padding: 10px 15px; border-bottom: 1px solid var(--border); color: var(--navy); flex-shrink: 1; }
    
    #content {

    }
    table { border-collapse: separate; border-spacing: 0; width: max-content; margin-bottom: 30px; }
    th, td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 2px 5px; white-space: nowrap; font-weight: normal; line-height: 1.2; vertical-align: middle; background: #fff; }

    th { background: var(--navy) !important; color: #fff; position: sticky; top: 0; z-index: 20; }
    .st { position: sticky; z-index: 10; background: #fff; }
    th.st { z-index: 30; }
    tr:nth-child(even) td { background: var(--row-even); }
    tr:nth-child(even) td.st { background: var(--row-even); }
    .al { text-align: left; } .ac { text-align: center; }

    @media print {
      body { overflow: visible !important; height: auto !important; display: block !important; }
      header, nav, .print-btn { display: none !important; }
      main, .view, #content { display: block !important; overflow: visible !important; }
      .print-group { page-break-inside: auto; margin-top: 15px; border-top: 1px solid #000; }
      .print-group:first-child { margin-top: 0; border-top: none; }
      table { width: 100% !important; border-collapse: collapse !important; border: 1px solid #000; page-break-inside: auto; margin-bottom: 10px; }
      tr { page-break-inside: avoid; }
      th, td { border: 1px solid #000 !important; background: #fff !important; white-space: normal; color: #000 !important; }
      th { background: #eee !important; position: static; }
      .st { position: static !important; }
      #gt { background: none; border: none; padding: 5px 0; color: #000; page-break-after: avoid; }
    }

    #modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; font-weight: normal; }
.modal-cont { background:#fff; padding:10px; border-radius:8px; width:max-content; max-width:98%; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 5px 15px rgba(0,0,0,0.3); }
.close-btn { flex-shrink:0; margin-bottom:8px; padding:6px; cursor:pointer; background:#800; color:#fff; border:none; border-radius:3px; }
#modal-body { overflow-y:auto; flex:1; }
.v-table { width:100%; border-collapse:collapse; }
.v-table td { padding:5px 5px; border:1px solid var(--border); vertical-align:middle; text-align:left; font-size:13px; letter-spacing:-0.05em; }
.v-table td:first-child { background:var(--dark); color:#fff; text-align:left; width:1%; white-space:nowrap; }
.grid-cell { display:grid; grid-template-columns:50px 46px 60px 46px 1fr; column-gap:6px; align-items:center; justify-items:end; line-height:1; }
.grid-cell > *:last-child { justify-self:start; text-align:left; }
@media (max-width:600px) { .v-table td { padding:4px; font-size:12px; } .grid-cell { grid-template-columns:50px 46px 60px 46px 1fr; column-gap:4px; } }

    .grid-single { display: block; }

  </style>
</head>

(12)<br>2:47(14)|63:54(9)<br>5:53(6)| | | | | |77:05(9)<br>77:05(24)|||";
  const hTitle = document.getElementById('h-title');
  const hMeta = document.getElementById('h-meta');
  hTitle.textContent = eventName;
  hMeta.textContent = eventMeta;

  const groups = db.split('|||').filter(s => s.trim()).map(g => {
    const parts = g.split('||').filter(p => p.trim());
    const gH = parts[0].split('|'); 
    return { name: gH[0], sub: gH[1] || "", header: parts[1], data: parts.slice(2) };
  });

  let currentIdx = 0;

  function createTable(g, isPrint = false) {
    const hArr = g.header.split('|');
    const aligns = hArr.map(h => /имя|фамилия|команда/i.test(h) ? 'al' : 'ac');
    let html = isPrint ? `<div class="print-group"><div id="gt"><h2>${g.name}</h2><div class="sub">${g.sub}</div></div>` : '';
    html += `<table><thead><tr>${hArr.map((h, i) => `<th class="${!isPrint && i<2 ? 'st c'+(i+1) : ''} ${aligns[i]}">${h}</th>`).join('')}</tr></thead><tbody>`;
    g.data.forEach(r => {
      const rowData = r.split('|');
      // Добавляем вызов функции клика для обычного режима
      const clickAttr = isPrint ? '' : `onclick='showVertical("${g.header}", "${r}")' style="cursor:pointer"`;
      html += `<tr ${clickAttr}>${rowData.map((c, i) => `<td class="${!isPrint && i<2 ? 'st c'+(i+1) : ''} ${aligns[i]}">${c}</td>`).join('')}</tr>`;
    });
    return html + `</tbody></table>` + (isPrint ? `</div>` : '');
  }

  function show(idx) {
    currentIdx = idx;
    const g = groups[idx];
    document.querySelectorAll('nav button').forEach((b, i) => b.className = i==idx?'active':'');
    
    const gt = document.getElementById('gt');
    const cont = document.getElementById('content');
    
    if (!gt || !cont) {
        document.getElementById('v-box').innerHTML = '<div id="gt"></div><div id="content"></div>';
        return show(idx);
    }

    gt.innerHTML = `${g.name}${g.sub}</div>`;
    cont.innerHTML = createTable(g);
    updateSticky();
  }

  function updateSticky() {
    requestAnimationFrame(() => {
      const firstRow = document.querySelector('#content tbody tr');
      if (!firstRow) return;
      let offset = 0;
      for(let j=0; j<2; j++) {
        const cells = document.querySelectorAll(`#content .c${j+1}`);
        cells.forEach(c => c.style.left = offset + 'px');
        offset += firstRow.cells[j].offsetWidth;
      }
    });
  }

  function printAll() {
    let allHtml = `<div style="text-align:center"><h1>${eventName}</h1><p>${eventMeta}</p></div>`;
    groups.forEach(g => allHtml += createTable(g, true));
    const vBox = document.getElementById('v-box');
    const oldHtml = vBox.innerHTML;
    vBox.innerHTML = allHtml;
    window.print();
    vBox.innerHTML = '<div id="gt"></div><div id="content"></div>';
    show(currentIdx);
  }

  groups.forEach((g, i) => {
    const b = document.createElement('button');
    b.textContent = g.name;
    b.onclick = () => { show(i); document.getElementById('content').scrollTop = 0; };
    document.getElementById('m').appendChild(b);
  });

function showVertical(headerStr, rowStr) {
  const headers = headerStr.split('|'), values = rowStr.split('|'), group = groups[currentIdx];
  const toSec = (s) => { if (!s) return 0; const p = s.split('(')[0].trim().split(':').map(Number); return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : (p.length === 2 ? p[0]*60 + p[1] : p[0] || 0); };
  const fromSec = (s) => { const a = Math.round(Math.abs(s)), m = Math.floor(a/60), sc = String(a%60).padStart(2,'0'); return `${m}:${sc}`; };
  
  let vHtml = '<table class="v-table">';
  
  headers.forEach((h, i) => {
    if (!h.trim()) return;
    
    // Заменяем <br> на пробел в первом столбце (заголовке)
    const displayHeader = h.replace(/<br\s*\/?>/gi, ' ');
    
    const val = values[i] || '', mMatch = h.match(/(\d+)\s*m/i);
    let content = '';
    
    if (mMatch && val.includes('<br>')) {
      const p = val.split(/<br\s*\/?>/gi), cum = p[0].trim(), legVal = toSec(p[1]);
      let spd = '<span></span>', gap = '<span></span>', ldr = '<span></span>', minL = Infinity, lName = "";
      
      group.data.forEach(r => { 
        const c = r.split('|'); 
        if (c[i] && c[i].includes('<br>')) { 
          const t = toSec(c[i].split('<br>')[1]); 
          if (t > 0 && t < minL) { 
            minL = t; 
            lName = c[1].replace(/<br\s*\/?>/gi, ' '); 
          } 
        } 
      });
      
      if (legVal > 0) {
        spd = `<span>${fromSec(legVal / (parseInt(mMatch[1])/1000))}/km</span>`;
        gap = minL !== Infinity ? (legVal > minL ? `<span style="color:#800">+${fromSec(legVal-minL)}</span>` : `<span style="color:#060">0:00</span>`) : gap;
        ldr = `<span class="leader-name" style="color:#666">${lName}</span>`;
      }
      content = `<div class="grid-cell"><span>${cum}</span><span>${p[1].trim()}</span>${spd}${gap}${ldr}</div>`;
    } else { 
      content = `<div class="grid-single">${val.replace(/<br\s*\/?>/gi, ' ')}</div>`; 
    }
    
    // Используем очищенный displayHeader для вывода
    vHtml += `<tr><td>${displayHeader}</td><td>${content}</td></tr>`;
  });
  
  document.getElementById('modal-body').innerHTML = vHtml + '</table>';
  document.getElementById('modal').style.display = 'flex';
}
