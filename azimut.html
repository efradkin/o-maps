<body class="help-body stat-body index-body azimut-body">
    <script src="js/utils-common.js?v=64"></script>
    <script src="js/broken_links.js?v=7"></script>
    <script src="js/utils.js?v=80"></script>

    <header class="page-header">
        <nav class="page-header-actions" aria-label="Навигация по странице">
            <a href="index.html" target="_self" class="stat-map-link stat-map-link-right" title="Главная страница"><img src="images/home.png" alt="Главная страница" /></a>
            <script src="js/global-menu.js?v=66"></script>
            <script>writeGlobalMenuHtml();</script>
        </nav>
    </header>

    <main class="container azimut-content">
        <h1 id="azimutPageTitle" class="page-title mb-3">Журнал «Азимут»</h1>

        <div id="azimutSearchControls" class="d-flex flex-wrap align-items-center gap-3 mb-2">
            <div class="index-search flex-grow-1" style="max-width: 640px; margin: 6px 0 0;">
                <div class="input-group">
                    <input type="search" id="azimutSearchInput" class="form-control"
                           placeholder="Название статьи, автор, слово или «фраза»…"
                           autocomplete="off" spellcheck="false"
                           aria-label="Поиск по журналу «Азимут»">
                    <button type="button" id="azimutSearchBtn" class="cal-search__btn"
                            title="Поиск" aria-label="Поиск">
                        <img src="images/search_24.png" alt="Поиск">
                    </button>
                </div>
            </div>
            <label class="form-check d-flex align-items-center gap-2 mb-0" for="azimutFulltext">
                <input type="checkbox" id="azimutFulltext" class="form-check-input mt-0">
                <span>Полнотекстовый поиск</span>
            </label>
        </div>
        <p id="azimutSearchHint" class="small text-muted mb-2">
            Поиск работает по названиям статей. <!--Поиск по нескольким словам учитывает их все; точную фразу можно заключить в кавычки.-->
            Полнотекстовый индекс загружается только после включения соответствующего режима.
        </p>

        <div id="azimutSearchStatus" class="search-status" role="status" aria-live="polite">
            Загружаю каталог выпусков…
        </div>

        <section id="azimutResults" aria-live="polite" hidden>
            <div class="d-flex justify-content-between align-items-baseline gap-2 mb-3">
                <h2 class="h5 mb-0">Результаты поиска</h2>
                <span id="azimutResultsCount" class="small text-muted"></span>
            </div>
            <div id="azimutResultsList"></div>
        </section>

        <section id="azimutIssueDetail" class="azimut-issue-detail" aria-labelledby="azimutIssueDetailTitle" hidden>
            <a id="azimutIssueClose" class="azimut-issue-detail__close" href="azimut.html"
               target="_self" title="Назад к выпускам" aria-label="Назад к выпускам">×</a>
            <div class="azimut-issue-detail__header">
                <a id="azimutIssueBack" class="azimut-issue-detail__back" href="azimut.html" target="_self">← Назад к выпускам</a>
                <h2 id="azimutIssueDetailTitle" class="azimut-issue-detail__title"></h2>
            </div>
            <div class="azimut-issue-detail__layout">
                <div class="azimut-issue-detail__cover-column">
                    <div id="azimutIssueCover" class="azimut-issue-detail__cover"></div>
                    <a id="azimutIssueOpenPdf" class="azimut-issue-detail__open" href="#"
                       target="_blank" rel="noopener noreferrer">Открыть журнал</a>
                </div>
                <section class="azimut-issue-detail__content" aria-label="Содержание выпуска">
                    <p id="azimutIssueSummary" class="azimut-issue-detail__summary"></p>
                    <div id="azimutIssueArticles"></div>
                </section>
            </div>
        </section>

        <section id="azimutCatalogSection" aria-label="Выпуски журнала">
            <div class="d-flex justify-content-between align-items-baseline gap-2 mb-3">
                <h2 class="h5 mb-0">Выпуски журнала</h2>
                <span id="azimutIssuesCount" class="small text-muted"></span>
            </div>
            <div id="azimutIssues" class="row g-4"></div>
        </section>

        <p id="azimutSource" class="azimut-source">
            <a href="https://rufso.ru/журнал-азимут-по-номерам/" target="_blank" rel="noopener">
                Страница журнала «Азимут» на сайте ФСОР
            </a>
        </p>
    </main>

    <noscript>
        <div id="noscript_content">
            <p class="h1">Журнал «Азимут»</p>
            <p>Для работы каталога и поиска необходимо включить JavaScript.</p>
