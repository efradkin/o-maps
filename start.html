    <script>
        if ('KKM' === START_NAME_PARAM) {
            location.href = 'kkm.html';
        }
        if ('VOLKOV_A' === START_NAME_PARAM) {
            location.href = 'volkov_av.html';
        }

        // Фильтрация массива. Оставляем только карты нужного старта.
        oMaps = oMaps.filter(m => (m.layer !== undefined)); // m.start && m.start.includes(START_NAME_PARAM)
        oMaps.sort((a, b) => dateForCompare(b) - dateForCompare(a));

        let strt = starts[START_NAME_PARAM];
        document.getElementById('start_name').innerHTML = strt.name ?? strt.short;

        if (strt.info) {
            document.getElementById('start_info').style.display = 'block';
            document.querySelector('#start_info span').innerHTML = strt.info;

            if (strt.logo) {
                let logo = document.querySelector('#start_info img');
                logo.style.display = 'block';
                logo.src = './logo/' + strt.logo;
            }
        }

        let container = document.querySelector('.start-maps-wrapper');
        oMaps.forEach(m => {
            const events = findEventsForMap(m, true, START_NAME_PARAM);
/*
            let row = `
                    <div class="row">
                        <div class="col-sm-2"><a href="#map_href" target="_blank"><img src="#map_img_src" width="100"/></a></div>
                        <div class="col-sm-10"><a href="#map_link" target="_self">Маршрут от #map_month".#map_year - #map_place</a></div>
                    </div>
            `;
*/
            let row = `
                    <div class="start-map-box align-items-center d-flex justify-content-center">
                        <div>
                            <a href="#map_link" target="_self"><img src="#map_img_src" title="#map_title" /></a>
                            <div class="start-map-box-description">#map_title</div>
                        </div>
                    </div>
            `;
            row = row.replace('#map_img_src', mapImageUrl(m));
            row = row.replace('#map_href', m.link);
            row = row.replace('#map_link', 'map-info.html?map=' + getMapName(m));
            //row = row.replace('#map_month', date.getMonth() + 1);
            const mapTitle = `${strt.short}: ${startYear(m, events) ?? year(m)} - ${m.name}`;
            row = row.replaceAll('#map_title', mapTitle);
            const elRow = document.createElement("div");
            elRow.classList.add("row");
            elRow.innerHTML = row;
            container.appendChild(elRow);
        });

        writeWelcomeButton();
    </script>
