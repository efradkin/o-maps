    /* ============================ загрузка ============================ */

    function loadScript(src) {
        return new Promise(function (resolve, reject) {
            const el = document.createElement('script');
            el.src = src;
            el.onload = function () { resolve(); };
            el.onerror = function () { reject(new Error(src)); };
            document.head.appendChild(el);
        });
    }

    /* Календари объявлены через let, поэтому в window их нет: читаем
       глобальную лексическую переменную по имени. */
    function globalValue(name) {
        try {
            return (new Function('return typeof ' + name + ' !== "undefined" ? ' + name + ' : undefined;'))();
        } catch (e) {
            return undefined;
        }
    }

    function setStatus(text, isError) {
        const status = document.getElementById('sc_status');
        const spinner = document.getElementById('sheet-spinner');
        document.getElementById('sc_status_text').textContent = text;
        status.classList.toggle('sc-error', !!isError);
        if (spinner) spinner.style.display = isError ? 'none' : '';
        status.style.display = text ? 'flex' : 'none';
    }

    async function loadData() {
        const sources = [{ file: 'js/starts.js?v=21', variable: 'starts' }].concat(CALENDAR_SOURCES);
        const failed = [];
        let done = 0;

        setStatus('Читаем данные соревнований… 0 из ' + sources.length);

        await Promise.all(sources.map(function (s) {
            return loadScript(s.file)
                .catch(function () { failed.push(s.file); })
                .then(function () {
                    done++;
                    setStatus('Читаем данные соревнований… ' + done + ' из ' + sources.length);
                });
        }));

        if (failed.length) {
            console.warn('Не загрузились файлы данных: ' + failed.join(', '));
        }
        return failed;
    }

    /* ============================ разбор ============================ */

    function parseDate(value) {
        if (Array.isArray(value)) value = value[0];
        if (typeof value !== 'string') return null;
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(value);
        if (!m) return null;
        return new Date(+m[1], +m[2] - 1, +m[3]);
    }

    function dateKey(d) {
        const mm = d.getMonth() + 1;
        const dd = d.getDate();
        return d.getFullYear() + '-' + (mm < 10 ? '0' : '') + mm + '-' + (dd < 10 ? '0' : '') + dd;
    }

    /* Стартовые дни события: date .. endDate включительно.
       Ограничение в 400 дней — страховка от зацикливания на битой дате. */
    function eventDays(e) {
        const first = parseDate(e.date);
        if (!first) return [];
        let last = e.endDate ? parseDate(e.endDate) : first;
        if (!last || last < first) last = first;

        const days = [];
        const d = new Date(first.getTime());
        while (d <= last && days.length < 400) {
            days.push(dateKey(d));
            d.setDate(d.getDate() + 1);
        }
        return days;
    }

    const htmlBox = document.createElement('div');

    function plainText(html) {
        htmlBox.innerHTML = html || '';
        return (htmlBox.textContent || '').trim();
    }

    function collectRows() {
        const startsData = globalValue('starts') || {};
        const excluded = new Set(EXCLUDED_STARTS);
        const seenIds = new Set();
        const byCode = new Map();

        for (const source of CALENDAR_SOURCES) {
            const events = globalValue(source.variable);
            if (!Array.isArray(events)) continue;

            for (const e of events) {
                if (!e || !e.start || !e.date) continue;
                if (e.id) {
                    if (seenIds.has(e.id)) continue;   // один и тот же старт в двух календарях
                    seenIds.add(e.id);
                }

                const days = eventDays(e);
                if (!days.length) continue;

                const codes = Array.isArray(e.start) ? e.start : [e.start];
                for (const code of codes) {
                    if (!code || excluded.has(code)) continue;

                    let row = byCode.get(code);
                    if (!row) {
                        const s = startsData[code] || {};
                        row = {
                            code: code,
                            short: s.short || plainText(s.name) || code,
                            name: plainText(s.name) || s.short || code,
                            logo: s.logo || null,
                            rogaine: !!s.rogaine,
                            days: new Map(),      // год -> Set дат
                        };
                        byCode.set(code, row);
                    }

                    for (const day of days) {
                        const y = +day.slice(0, 4);
                        let set = row.days.get(y);
                        if (!set) { set = new Set(); row.days.set(y, set); }
                        set.add(day);
                    }
                }
            }
        }

        const rows = [];
        byCode.forEach(function (row) {
            const years = new Map();
            let total = 0;
            let max = 0;
            row.days.forEach(function (set, year) {
                years.set(year, set.size);
                total += set.size;
                if (set.size > max) max = set.size;
            });
            delete row.days;
            row.years = years;
            row.total = total;
            row.max = max;
            row.minYear = Math.min.apply(null, Array.from(years.keys()));
            row.maxYear = Math.max.apply(null, Array.from(years.keys()));
            rows.push(row);
        });

        /* Сверху — у кого больше дней проведения; при равенстве — по алфавиту. */
        rows.sort(function (a, b) {
            if (b.total !== a.total) return b.total - a.total;
            return a.name.localeCompare(b.name, 'ru');
        });
        return rows;
    }

    /* ============================ отрисовка ============================ */

    function svgEl(name, attrs) {
        const el = document.createElementNS(SVG_NS, name);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        return el;
    }

    function yearLabelStep(col) {
        if (col >= 30) return 1;
        if (col >= 22) return 2;
        return 5;
    }

    /* Годы с подписью: кратные шагу плюс крайние — но крайний пропускаем,
       если он встанет вплотную к соседней подписи и они налезут друг на друга.
       Столбцы при этом рисуются для всех лет подряд, пропусков в оси нет. */
    function labelledYears(minYear, maxYear, step) {
        const years = [];
        for (let year = minYear; year <= maxYear; year++) {
            if (year % step === 0) years.push(year);
        }
        if (step > 1) {
            if (!years.length || years[0] - minYear >= step - 1) years.unshift(minYear);
            if (!years.length || maxYear - years[years.length - 1] >= step - 1) years.push(maxYear);
        }
        return years;
    }

    function isNarrowScreen() {
        return window.matchMedia('(max-width: 700px)').matches;
    }

    function visibleRows() {
        const type = document.getElementById('sc_type_selector').value;
        let rows = allRows;
        if (type === 'ROGAINE') rows = allRows.filter(function (r) { return r.rogaine; });
        if (type === 'ORIENT') rows = allRows.filter(function (r) { return !r.rogaine; });
        return sortRows(rows);
    }

    /* Сортировка строк сверху вниз. Количественные варианты — по убыванию,
       название — по алфавиту. При равенстве всегда доводим до однозначного
       порядка, чтобы строки не прыгали при перерисовке. */
    function sortRows(rows) {
        const mode = document.getElementById('sc_sort_selector').value;
        const byName = function (a, b) { return a.name.localeCompare(b.name, 'ru'); };

        return rows.slice().sort(function (a, b) {
            if (mode === 'name') {
                return byName(a, b);
            }
            if (mode === 'age') {
                /* Первый старт: сверху те, кто начался раньше всех. */
                if (a.minYear !== b.minYear) return a.minYear - b.minYear;
                if (b.total !== a.total) return b.total - a.total;
                return byName(a, b);
            }
            if (mode === 'years') {
                if (b.years.size !== a.years.size) return b.years.size - a.years.size;
                if (b.total !== a.total) return b.total - a.total;
                return byName(a, b);
            }
            if (b.total !== a.total) return b.total - a.total;
            return byName(a, b);
        });
    }

    function render() {
        const plot = document.getElementById('sc_plot');
        const labels = document.getElementById('sc_labels');
        const card = document.getElementById('sc_card');

        /* Горизонтальный скроллер: на узком экране это вся диаграмма целиком,
           на широком — только правая её часть. */
        const scroller = isNarrowScreen() ? document.querySelector('.sc-chart') : plot;

        /* Запоминаем прокрутку до того, как выбросить старую диаграмму. */
        const keepScrollLeft = plot.firstChild ? scroller.scrollLeft : null;

        labels.innerHTML = '';
        plot.innerHTML = '';
        nodes = [];
        hideTooltip();

        const rows = visibleRows();
        card.style.display = '';
        if (!rows.length) {
            setStatus('Для выбранного типа соревнований данных нет.');
            return;
        }

        let minYear = Infinity;
        let maxYear = -Infinity;
        for (const r of rows) {
            if (r.minYear < minYear) minYear = r.minYear;
            if (r.maxYear > maxYear) maxYear = r.maxYear;
        }

        const yearCount = maxYear - minYear + 1;
        /* На узком экране диаграмму не ужимаем: год получает фиксированную
           ширину, а лишнее уезжает за край — страница прокручивается. */
        const available = plot.clientWidth || 800;
        const col = isNarrowScreen()
            ? SC.COL_NARROW
            : Math.max(SC.COL_MIN, Math.min(SC.COL_MAX, Math.floor(available / yearCount)));
        const width = col * yearCount;

        /* Толщина планки — абсолютная величина: столько-то пикселей за каждый
           стартовый день. Значение селектора и есть цена дня: «Мелкий» 1 px,
           «Средний» 2 px, «Крупный» 4 px. От состава диаграммы масштаб не
           зависит, поэтому планку можно сравнивать с планкой и при другом
           фильтре, и после правки EXCLUDED_STARTS. */
        const pxPerDay = +document.getElementById('sc_scale_selector').value || 1;
        function barWidth(days) {
            return Math.max(SC.BAR_MIN, pxPerDay * days);
        }

        /* Геометрия строк. */
        let y = SC.AXIS_H;
        const geometry = rows.map(function (row) {
            const height = Math.max(SC.ROW_MIN, Math.round(barWidth(row.max)));
            const item = { row: row, top: y, height: height, center: y + height / 2 };
            y += height + SC.ROW_GAP;
            return item;
        });
        const bodyBottom = y - SC.ROW_GAP;
        const totalHeight = bodyBottom + SC.AXIS_H;

        const svg = svgEl('svg', {
            width: width,
            height: totalHeight,
            viewBox: '0 0 ' + width + ' ' + totalHeight,
        });

        /* Полосы строк — чтобы глаз не терял строку на длинной диаграмме. */
        geometry.forEach(function (g, i) {
            if (i % 2 === 0) return;
            svg.appendChild(svgEl('rect', {
                x: 0, y: g.top - SC.ROW_GAP / 2,
                width: width, height: g.height + SC.ROW_GAP,
                'class': 'sc-row-stripe',
            }));
        });

        /* Сетка и подписи годов — сверху и снизу. */
        const step = yearLabelStep(col);
        for (const year of labelledYears(minYear, maxYear, step)) {
            const x = (year - minYear) * col + col / 2;
            svg.appendChild(svgEl('line', {
                x1: x, y1: SC.AXIS_H - 4, x2: x, y2: bodyBottom + 4, 'class': 'sc-grid-line',
            }));
            for (const ty of [SC.AXIS_H - 7, bodyBottom + SC.AXIS_H - 6]) {
                const text = svgEl('text', { x: x, y: ty, 'class': 'sc-year-label', 'text-anchor': 'middle' });
                text.textContent = year;
                svg.appendChild(text);
            }
        }

        /* Планки: сплошной участок = подряд идущие годы проведения. */
        geometry.forEach(function (g) {
            const row = g.row;
            const cls = row.rogaine ? 'sc-band-rogaine' : 'sc-band-orient';

            let run = [];
            for (let year = minYear; year <= maxYear + 1; year++) {
                const days = row.years.get(year) || 0;
                if (days > 0 && year <= maxYear) {
                    run.push({ year: year, days: days });
                    continue;
                }
                if (run.length) {
                    svg.appendChild(svgEl('path', { d: bandPath(run, g, minYear, col, barWidth), 'class': cls }));
                    run = [];
                }
            }

            /* Зоны наведения — по одной на год проведения. Каждая обёрнута в
               ссылку на календарь этого года: работают и обычный клик, и
               средняя кнопка, и «открыть в новой вкладке». */
            row.years.forEach(function (days, year) {
                const x = (year - minYear) * col;
                const bar = barWidth(days);
                const hit = Math.max(SC.HIT_MIN, bar);
                const rect = svgEl('rect', {
                    x: x, y: g.center - hit / 2, width: col, height: hit, 'class': 'sc-hit',
                });
                rect.setAttribute('data-node', nodes.length);

                /* target проставляем явно: <base target="_blank"> действует на
                   html-ссылки, а на svg-якорь браузеры его не распространяют. */
                const link = svgEl('a', {
                    href: 'calendar.html?startYear=' + year
                        + '&start=' + encodeURIComponent(row.code),
                    target: '_blank',
                });
                link.appendChild(rect);
                nodes.push({
                    row: row, year: year, days: days,
                    x: x, y: g.center - bar / 2, w: col, h: bar,
                });
                svg.appendChild(link);
            });
        });

        const highlight = svgEl('rect', { 'class': 'sc-highlight', id: 'sc_highlight', rx: 2 });
        svg.appendChild(highlight);

        svg.addEventListener('mousemove', onPlotMove);
        svg.addEventListener('mouseleave', hideTooltip);
        plot.appendChild(svg);

        /* Подписи слева — выровнены по центрам строк. */
        const narrow = isNarrowScreen();

        const head = document.createElement('div');
        head.className = 'sc-label sc-label-head';
        head.style.top = (SC.AXIS_H - 20) + 'px';
        head.textContent = 'Соревнование';
        labels.appendChild(head);

        geometry.forEach(function (g) {
            const div = document.createElement('div');
            div.className = 'sc-label';
            div.style.top = (g.center - 9) + 'px';
            div.title = g.row.name + ' — ' + g.row.total + ' '
                + plural(g.row.total, 'стартовый день', 'стартовых дня', 'стартовых дней')
                + ' за ' + g.row.years.size + ' '
                + plural(g.row.years.size, 'год', 'года', 'лет');
            const a = document.createElement('a');
            a.href = 'start.html?start=' + encodeURIComponent(g.row.code);
            if (g.row.logo) {
                /* Логотипа может не оказаться на диске — тогда просто прячем картинку. */
                const img = document.createElement('img');
                img.className = 'sc-label-logo';
                img.src = 'logo/' + g.row.logo;
                img.alt = '';
                img.onerror = function () { this.style.display = 'none'; };
                a.appendChild(img);
            }
            a.appendChild(document.createTextNode(narrow ? g.row.short : g.row.name));
            div.appendChild(a);
            labels.appendChild(div);
        });
        labels.style.height = totalHeight + 'px';

        /* Первая отрисовка показывает свежие годы — правый край диаграммы.
           При перестроении (фильтр, масштаб, resize) остаёмся там, где были. */
        if (keepScrollLeft === null) {
            scroller.scrollLeft = scroller.scrollWidth;
        } else {
            scroller.scrollLeft = Math.min(keepScrollLeft, scroller.scrollWidth);
        }

        lastPlotWidth = plot.clientWidth;
    }

    /* Ступенчатый контур планки: у каждого года своя толщина. */
    function bandPath(run, g, minYear, col, barWidth) {
        const top = [];
        const bottom = [];
        for (const cell of run) {
            const x1 = (cell.year - minYear) * col;
            const x2 = x1 + col;
            const half = barWidth(cell.days) / 2;
            top.push([x1, g.center - half], [x2, g.center - half]);
            bottom.push([x1, g.center + half], [x2, g.center + half]);
        }
        /* Нижний контур проходим справа налево: reverse() переворачивает и
           порядок лет, и порядок точек внутри года — получается замкнутый
           контур, а не «бантик». */
        bottom.reverse();

        const points = top.concat(bottom);
        let d = '';
        points.forEach(function (p, i) {
            d += (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
        });
        return d + 'Z';
    }

    function plural(n, one, few, many) {
        const n10 = n % 10;
        const n100 = n % 100;
        if (n10 === 1 && n100 !== 11) return one;
        if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
        return many;
    }

    /* ============================ тултип ============================ */

    function onPlotMove(event) {
        const target = event.target.closest ? event.target.closest('[data-node]') : null;
        if (!target) {
            hideTooltip();
            return;
        }
        showTooltip(nodes[+target.getAttribute('data-node')], event);
    }

    function showTooltip(node, event) {
        if (!node) return;
        const tooltip = document.getElementById('sc_tooltip');
        const highlight = document.getElementById('sc_highlight');

        if (highlight) {
            highlight.setAttribute('x', node.x + 0.75);
            highlight.setAttribute('y', node.y + 0.75);
            highlight.setAttribute('width', Math.max(1, node.w - 1.5));
            highlight.setAttribute('height', Math.max(1, node.h - 1.5));
            highlight.style.display = 'block';
        }

        let html = '';
        if (node.row.logo) {
            html += '<img class="sc-tooltip-logo" src="logo/' + node.row.logo
                 + '" alt="" onerror="this.style.display=\'none\'" />';
        }
        html += '<div class="sc-tooltip-name">' + escapeHtml(node.row.name) + '</div>';
        html += '<div>' + node.year + ' год</div>';
        html += '<div>Стартовых дней: <b>' + node.days + '</b></div>';
        html += '<div class="sc-tooltip-total">Всего ' + node.row.total + ' за '
             + node.row.years.size + ' ' + plural(node.row.years.size, 'год', 'года', 'лет') + '</div>';
        tooltip.innerHTML = html;
        tooltip.style.display = 'block';

        const box = tooltip.getBoundingClientRect();
        let left = event.clientX + 16;
        let top = event.clientY + 16;
        if (left + box.width > window.innerWidth - 8) left = event.clientX - box.width - 16;
        if (top + box.height > window.innerHeight - 8) top = event.clientY - box.height - 16;
        tooltip.style.left = Math.max(8, left) + 'px';
        tooltip.style.top = Math.max(8, top) + 'px';
    }

    function hideTooltip() {
        const tooltip = document.getElementById('sc_tooltip');
        const highlight = document.getElementById('sc_highlight');
        if (tooltip) tooltip.style.display = 'none';
        if (highlight) highlight.style.display = 'none';
    }

    function escapeHtml(text) {
        return String(text).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }

    /* ============================ запуск ============================ */

    async function start() {
        const failed = await loadData();

        if (!globalValue('starts')) {
            setStatus('Не удалось загрузить js/starts.js — диаграмму построить не из чего.', true);
            return;
        }

        setStatus('Строим диаграмму…');
        /* Даём браузеру отрисовать спиннер перед счётом. */
        await new Promise(function (resolve) { setTimeout(resolve, 0); });

        allRows = collectRows();
        if (!allRows.length) {
            setStatus('В календарях не нашлось ни одного соревнования с полем start.', true);
            return;
        }

        render();
        setStatus('', false);

        document.getElementById('sc_type_selector').addEventListener('change', render);
        document.getElementById('sc_sort_selector').addEventListener('change', render);
        document.getElementById('sc_scale_selector').addEventListener('change', render);

        let resizeTimer = null;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                if (document.getElementById('sc_plot').clientWidth !== lastPlotWidth) render();
            }, 150);
        });

        if (failed.length) {
            console.warn('Диаграмма построена без файлов: ' + failed.join(', '));
        }
    }

    start();
    </script>
</body>
</html>
